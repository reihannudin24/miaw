<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kucing kecil untuk Jenni</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FBF3EA;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#444441}
#app{width:100%;max-width:760px;padding:16px}
button{font:inherit;font-size:15px;padding:10px 18px;border-radius:999px;border:1.5px solid #E3CDB8;background:#FFFFFF;color:#444441;cursor:pointer;transition:transform .1s,background .2s}
button:hover{background:#FDF6EE}
button:active{transform:scale(.96)}
input{font:inherit;font-size:15px;padding:10px 14px;border-radius:999px;border:1.5px solid #E3CDB8;background:#FFFFFF;color:#444441;outline:none}
input:focus{border-color:#D4537E}
#kMsg{text-align:center;font-size:16px;line-height:1.6;color:#6B6459;margin:16px 0 12px;min-height:52px}
#kErr{flex-basis:100%;text-align:center;font-size:13px;color:#C0392B;margin:4px 0 0;min-height:18px}
#kStage{font-size:14px;color:#6B6459}
.k-tail{transform-origin:40px -28px;animation:kwag 1.6s ease-in-out infinite}
#kFeet,#kArms{transition:transform .25s}
.k-lift #kFeet{transform:translateY(14px)}
.k-lift #kArms{transform:translateY(-10px)}
.k-lift .k-tail{animation-duration:.4s}
.k-fl{animation:kfloat 1.3s ease-out forwards;transform-box:fill-box;transform-origin:center}
.k-z{animation:kzz 2.8s ease-in-out infinite;opacity:0}
.k-cl{animation:kcloud 26s ease-in-out infinite alternate}
.k-rain{animation:krain .7s linear infinite}
.k-hint{animation:khint 1.2s ease-in-out infinite}
#kNight,.k-win{transition:opacity 1.2s,fill 1.2s}
#kSun{transition:cy 1.2s}
#kFoam{transition:opacity .3s}
#kCat{cursor:grab}
.k-tap{cursor:pointer}
#kSvg{border-radius:16px;display:block;user-select:none;-webkit-user-select:none}
#kSvg text{font-family:inherit}
@keyframes kwag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@keyframes kfloat{0%{opacity:1;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-80px) scale(1.5)}}
@keyframes kzz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(18px,-46px)}}
@keyframes kcloud{0%{transform:translateX(-30px)}100%{transform:translateX(50px)}}
@keyframes krain{0%{transform:translateY(-20px)}100%{transform:translateY(20px)}}
@keyframes khint{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes krot{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.k-tail,.k-z,.k-cl,.k-rain,.k-hint{animation:none}}
#kRot{display:none}
@media (orientation:portrait) and (max-width:600px){
  html,body{overflow:hidden;height:100%}
  #kRot{display:flex;position:fixed;inset:0;z-index:10;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:#FBF3EA;text-align:center;font-size:17px;line-height:1.5;color:#6B6459}
  #kRot svg{animation:krot 2.4s ease-in-out infinite}
}
@media (orientation:landscape) and (max-height:540px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;min-height:0;height:100vh;height:100dvh;background:#2C2C2A}
  #app{position:relative;padding:0;margin:0;max-width:none;flex:none;width:min(100vw,calc(100vh*680/420));height:min(100vh,calc(100vw*420/680))}
  @supports (height:100dvh){
    #app{width:min(100vw,calc(100dvh*680/420));height:min(100dvh,calc(100vw*420/680))}
  }
  #kSvg{width:100%;height:100%;border-radius:0}
  #kMsg{position:absolute;top:2.5%;left:26%;right:2%;margin:0;min-height:0;padding:5px 12px;background:rgba(255,255,255,.9);border-radius:12px;font-size:clamp(11px,3.5vh,15px);line-height:1.4;pointer-events:none}
  #kC0,#kC1{position:absolute;right:2%;bottom:3%;gap:6px!important;justify-content:flex-end!important}
  #kC2{position:absolute;right:2%;bottom:1.5%;gap:6px!important;flex-wrap:nowrap!important}
  button,input{padding:5px 12px;font-size:clamp(11px,3.4vh,14px)}
  #kName{width:120px!important}
  #kErr{flex-basis:100%;text-align:right;margin:0;min-height:0;background:rgba(255,255,255,.9);border-radius:8px;padding:0 8px}
  #kErr:empty{display:none}
  #kStage{background:rgba(255,255,255,.9);padding:3px 10px;border-radius:999px;font-size:clamp(10px,3vh,13px);white-space:nowrap}
  #kC2 button{padding:3px 10px;font-size:clamp(10px,3vh,13px)!important}
}
</style>
</head>

setInterval(function(){if(!started||drag||asleep||inTub||nom||held||y<G||target!==null)return;if(q==='pick'||q==='eating'||q==='trick'||q==='mem')return;if(Math.random()<.5){spd=fleeing?3:1.2;target=90+Math.random()*500}},4500);

$('kTomorrow').addEventListener('click',function(){if(q==='end'){day=1;beginDay();meow(.2)}else if(day>=3){ending()}else{day++;beginDay();meow(.2);sq=1.25}});

function start(){var v=$('kName').value.trim();if(!v){$('kErr').textContent='Isi nama kucingnya dulu ya.';return}name=v;$('kName').blur();show($('kIntro'),false);show($('kGame'),true);$('kC1').style.display='none';$('kC2').style.display='flex';svg.style.touchAction='none';started=true;beginDay();y=140;meow(.3);requestAnimationFrame(frame)}
$('kNameOk').addEventListener('click',start);
$('kName').addEventListener('input',function(){$('kErr').textContent=''});
$('kName').addEventListener('keydown',function(e){if(e.key==='Enter')start()});
